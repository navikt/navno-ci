# Tags the built commit and creates a release whose body records the deployed image.
# When an image is given, the release is read back with navno-actions/find-release to confirm a rollback can use it.
name: Create GitHub release
on:
  workflow_call:
    inputs:
      target-commitish:
        description: Commit or branch the tag points at. Defaults to the commit that triggered the workflow, the one that was built.
        type: string
        required: false
        default: ${{ github.sha }}
      tag-prefix:
        description: Prefix for the tag. A Unix timestamp is appended.
        type: string
        required: false
        default: release/prod@
      name:
        description: Release title. Defaults to `Release <ref name>`.
        type: string
        required: false
        default: ""
      image:
        description: Image the release deployed. Recorded as a `Deployed image:` line that navno-actions/find-release reads, e.g. to roll back.
        type: string
        required: false
        default: ""
      body:
        description: Text placed below the image line and above the generated release notes.
        type: string
        required: false
        default: ""
    secrets:
      RELEASE_TOKEN:
        description: "PAT with `contents: write`, used to create the release. Optional; falls back to `github.token`, in which case the release does not trigger other workflows."
        required: false

concurrency:
  group: navno-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create a new release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate unique tag name
        id: tag
        env:
          PREFIX: ${{ inputs.tag-prefix }}
        run: echo "name=${PREFIX}$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          target_commitish: ${{ inputs.target-commitish }}
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ inputs.name != '' && inputs.name || format('Release {0}', github.ref_name) }}
          # navno-actions/find-release parses this line; change the two together.
          body: |
            ${{ inputs.image && format('Deployed image: `{0}`', inputs.image) }}

            ${{ inputs.body }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Check that a rollback can use this release
        if: ${{ inputs.image != '' }}
        uses: navikt/navno-actions/find-release@v1
        with:
          tag: ${{ steps.tag.outputs.name }}
          tag-prefix: ${{ inputs.tag-prefix }}
